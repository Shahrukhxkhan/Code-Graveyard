name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Run type-check
        run: npm run type-check

  test-ts:
    name: TypeScript Test Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript test suites
        run: npm test

  test-sql:
    name: SQL & RLS Test Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply Schemas and Migrations
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/schema.sql
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/migration_moderation.sql
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/migration_adoptions_resolution.sql
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/migration_ai_summary.sql
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/migration_pgvector_semantic_search.sql
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/migration_similar_projects.sql
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/migration_weekly_digest.sql
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/migration_leaderboard_badges.sql
          psql -h localhost -U postgres -d postgres -f src/lib/supabase/migration_discovery_indexes.sql
      - name: Run RLS Test Suite
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f src/lib/supabase/test-rls.sql
      - name: Run Explain Analyze Test Suite
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f src/lib/supabase/test-explain.sql

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhYnZjZGVmZ2hpams' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhYnZjZGVmZ2hpams' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'dummy_anthropic_key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy_openai_key' }}
        run: npm run build
